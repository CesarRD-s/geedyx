services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: geedyx
      POSTGRES_USER: geedyx
      POSTGRES_PASSWORD: geedyx
    ports:
      - '5432:5432'
    volumes:
      - geedyx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geedyx -d geedyx']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geedyx-postgres:
